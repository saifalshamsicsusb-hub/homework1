<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Diwan Homes Dubai">
  <title>Diwan Homes — Dubai</title>
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A24C"/>
      <stop offset="1" stop-color="#9B6D26"/>
    </linearGradient>
  </defs>

  <!-- Mark: mashrabiya-inspired three-lobed arch enclosing a stylized house.
       Emerald frame, bronze arch, cream negative space. Symmetrical around x=400. -->
  <g transform="translate(400 340)">
    <!-- Emerald square frame with soft radius, holds the mark -->
    <rect x="-190" y="-190" width="380" height="380" rx="26" fill="#0F4C3A"/>
    <!-- Thin bronze inner rule -->
    <rect x="-170" y="-170" width="340" height="340" rx="18" fill="none" stroke="#B8873B" stroke-width="2" opacity="0.7"/>

    <!-- Three-lobed arch (mashrabiya). Built as one filled path in bronze,
         with a cream inner cutout revealing the "house" silhouette below. -->
    <path d="
      M -130 130
      L -130 -10
      C -130 -80  -70 -130   0 -130
      C  70 -130  130 -80   130 -10
      L  130 130
      Z
      M -70 130
      L -70 -10
      C -70 -50  -40 -80    0 -80
      C  40 -80   70 -50    70 -10
      L  70 130
      Z
    " fill="url(#bronze)" fill-rule="evenodd"/>

    <!-- House silhouette inside the arch (cream), formed by roof + walls.
         Sits at the base of the arch so the arch reads as the doorway. -->
    <path d="
      M -55 130
      L -55  10
      L   0 -38
      L  55  10
      L  55 130
      Z
    " fill="#F5EDDC"/>

    <!-- Door within the little house: emerald, echoes the frame -->
    <rect x="-14" y="60" width="28" height="70" rx="4" fill="#0F4C3A"/>

    <!-- Small bronze finial dot atop the arch -->
    <circle cx="0" cy="-150" r="8" fill="#B8873B"/>
  </g>

  <!-- Wordmark: DIWAN in serif with wide tracking, HOMES DUBAI below in sans small caps -->
  <g text-anchor="middle" fill="#0F4C3A">
    <text x="400" y="640"
          font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
          font-size="120" font-weight="600" letter-spacing="18">DIWAN</text>
    <text x="400" y="700"
          font-family="Inter, 'Segoe UI', Arial, sans-serif"
          font-size="30" font-weight="500" letter-spacing="14" fill="#B8873B">HOMES &#183; DUBAI</text>
  </g>
</svg>
